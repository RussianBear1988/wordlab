function beep(ok=true){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=ok?640:190;o.type='sine';g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.16);o.start();o.stop(audioCtx.currentTime+.17)}catch{}}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}

function intro(m){screen='intro';mode=m;app.innerHTML=`<div class="game-top"><button class="text-btn" data-home>← Все эксперименты</button><span class="pill">Эксперимент 0${m==='signs'?1:m==='build'?2:3}</span></div><section class="intro intro-layout"><div><div class="eyebrow">Инструктаж перед запуском</div><h1>${modeTitles[m]}</h1><p class="lead">${m==='signs'?'У каждой части слова есть свой знак. Найди им правильные места.':m==='build'?'Набор запчастей, немного времени и очень много возможных слов. Что соберёшь ты?':'Одной маленькой детали достаточно, чтобы слово стало совсем другим.'}</p><div class="steps">${(m==='signs'?[['Выбери знак','Перетащи его над нужной частью слова. Или нажми на знак, а затем на пустое место.'],['Проверь себя','Верный разбор: +10 очков. Ошибка: −5. После проверки увидишь правильные обозначения.'],['Дойди до результата','Шесть слов за раунд. Таймера нет: можно спокойно подумать.']]:m==='build'?[['Собирай на верстаке','Нажми на деталь или перетащи её в нужное место. Корень и окончание обязательны. ∅ – тоже окончание.'],['Проверяй настоящие слова','Новое слово: от +15 очков. Другая форма уже найденного слова: +4. Повтор: 0. Неподтверждённое слово: −10. Ошибка в известном разборе: −5.'],['Открывай новые ящики','В раунде доступны все четыре ящика деталей. Подсказка стоит 5 очков и показывает новое слово.']]:[['Прочитай заказ','На верстаке уже есть слово. Узнай, во что его нужно превратить.'],['Замени одну деталь','Можно заменить карточку или добавить приставку. Верный ответ: +25. Ошибка: −5.'],['Разберись в превращении','После каждого заказа появится объяснение. За раунд нужно выполнить шесть заказов.']]).map((a,i)=>`<div class="step"><span>${i+1}</span><p><b>${a[0]}</b>${a[1]}</p></div>`).join('')}</div>${m==='build'?`<div class="setting-group"><span>Сколько времени дадим изобретателю?</span><div class="segmented">${[[120,'2 минуты'],[180,'3 минуты'],[0,'Без таймера']].map(([v,t])=>`<button data-duration="${v}" class="${duration===v?'active' function start(){clearInterval(timer);screen='game';session={mode,score:0,correct:0,mistakes:[],history:[],found:[],lemmas:[],seen:new Set(),hinted:new Set(),attempts:new Set(),hints:0,shelf:0,parts:['','','',''],step:0,tasks:mode==='repair'?shuffle(taskDefs).slice(0,6):shuffle(notationKeys).slice(0,6),answers:[],checked:false,message:'',messageType:'',remaining:mode==='build'?duration:0,showAllEnds:false,activeMs:0,lastTick:performance.now(),finished:false};selectedSymbol=null;if(mode==='repair')session.parts=split(session.tasks[0].start);renderGame();goTop();timer=setInterval(tick,200)}
function tick(){if(!session||screen!=='game'||session.finished)return;const now=performance.now(),dt=now-session.lastTick;session.lastTick=now;if(dialog.open||document.hidden)return;session.activeMs+=dt;if(mode==='build'&&duration){session.remaining=Math.max(0,duration-session.activeMs/1000);const el=document.querySelector('#time');if(el){el.textContent=fmt(session.remaining);el.parentElement.classList.toggle('time-low',session.remaining<=20)}if(session.remaining<=0)finish()}}
function fmt(s){s=Math.ceil(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function hud(){return `<div class="game-top"><button class="text-btn" data-leave>← К экспериментам</button><div class="hud"><div class="hud-item score"><b id="score">${session.score}</b> очк.</div><div class="hud-item"><b id="time">${mode==='build'?(duration?fmt(session.remaining):'∞'):(session.step+1)+'/6'}</b>${mode==='build'?'время':'заказ'}</div></div></div>`}
function side(){const talks=['Ход эксперимента одобрен. Чайник пока не взорвался.','Суффиксы посчитаны. Один пытался выдать себя за корень.','Гипотеза: если приставить «под», получится подгипотеза. Проверять не будем.','Слово «ерундовина» в этот ящик пока не помещается.','Сегодня я изобрёл лесника. Правда, он уже существовал.'];return `<aside class="sidebar"><div class="side-card"><h3>${mode==='build'?'Собрано слов: '+session.found.length:'Выполнено: '+session.correct+' из 6'}</h3><div class="found-list">${session.found.length?session.found.slice().reverse().map(w=>`<span class="found-word">${esc(w)}</span>`).join(''):`<p class="placeholder">${mode==='build'?'Здесь появятся твои находки. Первое слово уже ждёт.':'Верные ответы появятся здесь.'}</p>`}</div></div><div class="side-card robot-talk"><div class="robot-mini" aria-hidden="true">••</div><p>${talks[Math.min(4,Math.floor(session.correct/3))]}</p><small>Профессор Корешок<br>начальник необязательных изобретений</small></div><div class="rules-tiny">${mode==='build'?'<strong>Новое слово</strong> +10 за корень, +5 за каждую другую деталь.<br><strong>Новая словоформа</strong> +4 · <strong>Ошибка</strong> −10.<br>Слово есть, но разбор не проверен? Сохраним попытку без штрафа.':'За одну и ту же ошибочную сборку повторно очки не снимаются.'}</div></aside>`}
function renderGame(){if(!session)return;app.innerHTML=hud()+`<div class="game-title"><div><div class="eyebrow">Эксперимент 0${mode==='signs'?1:mode==='build'?2:3}</div><h2>${modeTitles[mode]}</h2><p>${mode==='build'?'Создай слово. Проверь. Отправь на полку с открытиями.':mode==='signs'?'Перетащи обозначения над частями слова.': 'Прочитай заказ и измени ровно одну деталь.'}</p></div>${mode==='build'?'<button class="text-btn" data-finish>Завершить раунд ↗</button>':'<span class="pill">Без таймера</span>'}</div><div class="play-layout"><section class="panel">${mode==='signs'?notation():builder()}</section>${side()}</div>`}
function progress(){return `<div class="panel-label"><span>Заказ ${session.step+1} / 6</span><span>${mode==='signs'?'Узнай обозначения':'Одна деталь – другое слово'}</span></div><div class="progress"><i style="width:${session.step/6*100}%"></i></div>`}
function notation(){const parts=split(session.tasks[session.step]);const bits=parts.map((p,t)=>({p,t})).filter(x=>x.p);return progress()+`<div class="task-box"><p>Разбери слово</p><strong>${join(parts)}</strong></div><div class="notation-word">${bits.map((x,i)=>`<div class="notation-piece"><button class="notation-drop ${session.answers[i]!==undefined?'filled':''}" data-noteslot="${i}" aria-label="Обозначение над частью ${esc(x.p)}" ${session.checked?'disabled':''}>${session.answers[i]!==undefined?sym(session.answers[i]):'?'}</button><span class="tile">${x.p}</span>${session.checked?`<small>${names[x.t]}</small>`:''}</div>`).join('')}</div><div class="symbol-bank">${names.map((n,t)=>`<button class="symbol-chip ${selectedSymbol===t?'selected':''}" data-symbol="${t}" data-type="${t}" aria-pressed="${selectedSymbol===t}" ${session.checked?'disabled':''}>${sym(t)}<span>${n}</span></button>`).join('')}</div><div class="actions"><button class="btn lime full" ${session.checked?'data-next':'data-check'}>${session.checked?(session.step===5?'Итоги эксперимента':'Следующее слово →'):'Проверить обозначения'}</button></div><p class="feedback ${session.messageType}" role="status">${session.message||'Нажми на знак, затем на место над частью слова. Или перетащи знак.'}</p>`}
function availableBank(){if(mode==='build'){let roots=shelfDefs[session.shelf].roots;const base=D.bases.filter(x=>roots.includes(x[1]));return [0,1,2,3].map(t=> t===3?(session.showAllEnds?D.inventory[3]:['∅','а','о','и','ы','у','е','я','ом','ый','ой','ий','ая','ое','ые']):t===1?roots:[...new Set(base.map(x=>x[t]).filter(Boolean))]);}const task=session.tasks[session.step],a=split(task.start),b=split(task.target);return [0,1,2,3].map(t=>[...new Set([a[t],b[t],...([['под','пере','за'],['лес','дом','вод'],['ик','ник','н'],['∅','а','и','ый','ая']][t])].filter(Boolean))])}
function slots(){return `<div class="slots">${names.map((n,t)=>`<button class="slot ${session.parts[t]?'filled':''}" data-slot="${t}" data-type="${t}" aria-label="${n}${session.parts[t]?': '+session.parts[t]+', нажми, чтобы убрать':', пустое место'}" ${session.checked?'disabled':''}>${session.parts[t]?'<span class="remove" aria-hidden="true">×</span>':''}${sym(t)}${session.parts[t]?`<span class="part-value">${session.parts[t]}</span>`:''}<span>${n}</span></button>`).join('')}</div>`}
function builder(){return (mode==='repair'?progress()+`<div class="task-box"><p>${session.tasks[session.step].text}</p><strong>Было: ${join(split(session.tasks[session.step].start))}</strong></div>`:`<div class="panel-label"><span>Верстак изобретателя</span><span>Карточки можно использовать снова</span></div><div class="tabs" aria-label="Ящики деталей">${shelfDefs.map((x,i)=>`<button class="tab ${i===session.shelf?'active':''}" data-shelf="${i}">${x.name}</button>`).join('')}</div>`)+`<div class="workbench"><div class="word-preview ${join(session.parts)?'':'empty'}">${join(session.parts)||'Здесь появится слово'}</div>${slots()}</div><div class="actions"><button class="btn lime check" ${session.checked?'data-next':'data-check'}>${session.checked?(session.step===5?'Итоги эксперимента':'Следующий заказ →'):'Проверить слово'} <span>↗</span></button>${!session.checked?'<button class="btn secondary" data-clear aria-label="Очистить верстак">Сброс</button>':''}</div><p class="feedback ${session.messageType}" role="status">${session.message||'Приставку и суффикс можно пропускать. Корень и окончание нужны всегда.'}</p>${!session.checked?`<div class="bank"><div class="bank-head"><h3>Ящик с запчастями</h3><p>Перетащи или нажми</p></div>${availableBank().map((parts,t)=>`<div class="bank-row"><div class="bank-label">${names[t]}</div><div class="chips">${parts.map(p=>`<button class="chip ${p.length>4?'small':''}" data-part="${p}" data-type="${t}" aria-label="${names[t]} ${p==='∅'?'нулевое окончание':p}">${p}</button>`).join('')}</div></div>`).join('')}${mode==='build'?`<button class="hint-btn" data-more-ends>${session.showAllEnds?'Меньше окончаний ↑':'Ещё окончания ↓'}</button>`:''}</div><div class="hint-row"><button class="hint-btn" data-hint>Подсказка −5 очк.</button><button class="hint-btn" data-help>Шпаргалка с обозначениями</button></div>`:''}`}
function message(msg,type=''){session.message=msg;session.messageType=type;renderGame()}
function put(t,p){if(!session||session.checked)return;session.parts[t]=p;session.message='';session.messageType='';renderGame()}
function penalty(word,detail,amount){const key=mode+'|'+session.step+'|'+session.parts.join('|')+'|'+(mode==='signs'?session.answers.join(','):'');if(session.attempts.has(key))return false;session.attempts.add(key);session.score-=amount;session.mistakes.push({word,detail,points:-amount});beep(false);return true}
function check(){if(session.checked)return;if(mode==='signs'){const bits=split(session.tasks[session.step]).map((p,t)=>({p,t})).filter(x=>x.p);if(bits.some((x,i)=>session.answers[i]===undefined)){message('Сначала поставь знак над каждой частью слова.');return;}const ok=bits.every((x,i)=>session.answers[i]===x.t);const detail=bits.map(x=>`${x.p} – ${names[x.t].toLowerCase()}`).join('; ')+'.';if(ok){session.score+=10;session.correct++;session.found.push(join(split(session.tasks[session.step])));beep();session.message='Все обозначения на месте. +10 очков. '+detail;session.messageType='success';}else{penalty(join(split(session.tasks[session.step])),detail,5);session.message='−5 очков. Посмотри на правильные обозначения: '+detail;session.messageType='error';}session.history.push({word:join(split(session.tasks[session.step])),detail,points:ok?10:-5});session.answers=bits.map(x=>x.t);session.checked=true;selectedSymbol=null;renderGame();return;}
 const parts=session.parts,w=join(parts),key=parts.join('|');if(!parts[1]||!parts[3]){message('Добавь корень и окончание. Если окончание нулевое, выбери ∅.');return;}
 if(mode==='repair'){const task=session.tasks[session.step];if(key===task.target){let detail=task.hint;session.score+=25;session.correct++;session.found.push(w);session.history.push({word:w,detail,points:25});session.checked=true;session.message='+25 очков. Заказ выполнен! '+detail;session.messageType='success';beep();confetti();renderGame();return;}const changes=parts.filter((v,i)=>v!==split(task.start)[i]).length;const detail=changes===0?'Слово пока осталось прежним.':changes!==1?'По условию нужно изменить ровно одну деталь.':'Сборка пока не подходит к заказу. Прочитай условие ещё раз.';const charged=penalty(w,detail,5);message((charged?'−5 очков. ':'Повтор этой попытки: 0 очков. ')+detail,'error');return;}
 if(valid[key]){const entry=valid[key];if(session.seen.has(normalize(entry.w))){message('Это слово уже на полке. 0 очков. Попробуй собрать другое.','warn');return;}const newLemma=!session.lemmas.includes(entry.lemma);const pts=newLemma?10+parts.filter((x,t)=>x&&t!==1).length*5:4;session.score+=pts;session.correct++;session.seen.add(normalize(entry.w));session.found.push(entry.w);if(newLemma)session.lemmas.push(entry.lemma);session.history.push({word:entry.w,detail:parts.filter(Boolean).join(' · ')+(newLemma?'':' · новая форма слова «'+entry.lemma+'»'),points:pts});session.message=`«${entry.w}» отправляется на полку. +${pts} очк.${newLemma?'':' Это новая форма уже найденного слова.'}`;session.messageType='success';session.parts=['','','',''];beep();if(session.correct%5===0)confetti();renderGame();return;}
 if(known.has(w)){const alternatives=Object.keys(valid).filter(k=>normalize(valid[k].w)===normalize(w));if(alternatives.length){const detail='Слово существует, но детали выбраны неверно. Верный разбор: '+split(alternatives[0]).filter(Boolean).join(' · ')+'.';const charged=penalty(w,detail,5);message((charged?'−5 очков. ':'Повтор попытки: 0 очков. ')+detail,'error');return;}const detail='Слово есть в словаре, но этот разбор пока не включён в учебную базу. Попытка без штрафа.';session.history.push({word:w,detail,points:0});message(detail+' Очки сохраняются.','warn');return;}
 const charged=penalty(w,'Словарь не подтверждает эту сборку. Проверь написание и сочетаемость деталей.',10);message((charged?'−10 очков. ':'Повтор этой попытки: 0 очков. ')+`Словарь не подтверждает «${w}». Проверь детали или воспользуйся подсказкой.`,'error');}
function next(){if(!session.checked)return;if(session.step===5){finish();return;}session.step++;session.answers=[];session.checked=false;session.message='';session.messageType='';selectedSymbol=null;if(mode==='repair')session.parts=split(session.tasks[session.step].start);renderGame();goTop()}
function hint(){if(session.checked)return;if(mode==='repair'){if(session.hinted.has(session.step)){message('Подсказка уже открыта: '+session.tasks[session.step].hint,'warn');return;}session.hinted.add(session.step);session.score-=5;session.hints++;message('−5 очков. '+session.tasks[session.step].hint,'warn');return;}
 const bank=availableBank();const options=Object.entries(valid).filter(([k,v])=>split(k).every((p,t)=>!p||bank[t].includes(p))&&!session.seen.has(normalize(v.w))&&!session.hinted.has(v.w));const pref=options.filter(([k,v])=>!session.lemmas.includes(v.lemma));const pick=shuffle(pref.length?pref:options)[0];if(!pick){message('Подсказки для этого ящика закончились. Открой другой. Очки сохраняются.','warn');return;}session.score-=5;session.hints++;session.hinted.add(pick[1].w);session.history.push({word:'Подсказка',detail:pick[1].w,points:-5});message('−5 очков. Попробуй собрать «'+pick[1].w+'»: '+split(pick[0]).filter(Boolean).join(' · ')+'.','warn');}
function finish(){if(!session||session.finished)return;session.finished=true;clearInterval(timer);screen='results';const s=session;const isRecord=s.score>best(mode);if(isRecord)store.set('slovolab-best-'+mode,s.score);let count=s.correct+s.mistakes.length;const accuracy=count?Math.round(s.correct/count*100):0;app.innerHTML=`<div class="game-top"><button class="text-btn" data-home>← Все эксперименты</button><span class="pill">${modeTitles[mode]}</span></div><div class="end-heading"><div><div class="eyebrow">${isRecord?'Личный рекорд':'Протокол эксперимента'}</div><h1>${s.correct===0?'Начало положено.':s.correct<4?'Механизм запущен!':'Есть словесный контакт!'}</h1><p>${s.correct===0?'Первая попытка – часть исследования. Можно попробовать снова.':'Профессор Корешок занёс твои открытия в журнал.'}</p></div><div class="big-score">${s.score}<small>ОЧКОВ ЗА РАУНД</small></div></div><div class="stat-grid"><div class="stat"><b>${s.correct}${mode==='build'?'':' / 6'}</b><span>${mode==='build'?'собрано словоформ':'верных ответов'}</span></div><div class="stat"><b>${mode==='build'?s.lemmas.length:accuracy+'%'}</b><span>${mode==='build'?'разных слов':'точность ответов'}</span></div><div class="stat"><b>${s.mistakes.length}</b><span>ошибок со штрафом</span></div><div class="stat"><b>${fmt(s.activeMs/1000)}</b><span>время в игре · подсказок ${s.hints}</span></div></div><div class="results-grid"><section class="panel"><h3>Полка с открытиями</h3>${s.history.filter(x=>x.points>0).length?s.history.filter(x=>x.points>0).map(x=>`<div class="result-row"><strong>${esc(x.word)} <span class="plus">+${x.points}</span></strong><span>${esc(x.detail)}</span></div>`).join(''):'<p class="placeholder">Здесь появятся слова после следующего эксперимента.</p>'}</section><section class="panel"><h3>Что стоит разобрать</h3>${s.mistakes.length?s.mistakes.map(x=>`<div class="result-row"><strong>${esc(x.word)} <span class="minus">${x.points}</span></strong><span>${esc(x.detail)}</span></div>`).join(''):'<p class="placeholder">Попыток со штрафом в этом раунде нет.</p>'}${s.history.filter(x=>x.points===0).map(x=>`<div class="result-row"><strong>${esc(x.word)} <span>0 очков</span></strong><span>${esc(x.detail)}</span></div>`).join('')}${s.hints?`<div class="result-row"><strong>Подсказки: ${s.hints} <span class="minus">−${s.hints*5}</span></strong><span>Профессор поделился рабочими записями.</span></div>`:''}</section></div><div class="message-box">${mode==='build'?'Следующий эксперимент: найди слова с приставками в ящиках «Походная» и «Чудная». Меняй окончания: одна основа может дать несколько форм.':mode==='signs'?'Теперь можно отправиться на фабрику и собирать слова самостоятельно. Знакомые обозначения помогут выбрать детали.':'Попробуй фабрику слов: теперь ты знаешь, как одна деталь меняет смысл целого слова.'}</div><div class="end-actions"><button class="btn lime" data-start>Ещё один раунд ↻</button><button class="btn secondary" data-home>Все эксперименты</button><button class="btn secondary" data-copy>Скопировать результат</button></div>`;if(isRecord)confetti();goTop()}
function openDialog(html){document.querySelector('#dialog-body').innerHTML=html;dialog.showModal();pauseStarted=performance.now()}
function closeDialog(){dialog.close();if(session)session.lastTick=performance.now();pauseStarted=null}
function help(){openDialog(`<h2>Шпаргалка изобретателя</h2>${[['Приставка','Стоит перед корнем. Помогает образовать слово: под-вод-н-ый.'],['Корень','Общая часть родственных слов: лес, лесной, лесник.'],['Суффикс','Стоит после корня. Помогает образовать новое слово: дом-ик.'],['Окончание','Изменяется при изменении формы слова: вод-а, вод-ы.']].map(([n,d],i)=>`<div class="help-item"><div class="help-symbol">${sym(i)}</div><p><b>${n}</b>${d}</p></div>`).join('')}<p><b>∅ – нулевое окончание.</b> В слове «лесник» окончание есть, но звуками не выражено. Сравни: лесник∅ – лесника – лесники.</p><p>У неизменяемых слов окончания нет. В этой версии собираем существительные и прилагательные с окончаниями.</p><button class="btn lime full" data-close>Всё ясно, продолжаем</button>`)}
function about(){openDialog(`<h2>Для взрослых</h2><p>Первая онлайн-версия бумажной игры «Словолаборатория» для 4 класса. Три режима работают с частями слова: приставкой, корнем, суффиксом и окончанием.</p><p><b>Словарная проверка.</b> В учебной базе ${D.meta.lexemes} слов и ${D.meta.forms} словоформ с проверенными схемами сборки. Исходные формы расширены через словарь <a href="https://opencorpora.org/" target="_blank" rel="noopener">OpenCorpora</a>. Используются только словарные записи, без автоматического угадывания новых слов.</p><p>Для всех доступных сочетаний деталей отдельно проверено существование слова. Если слово есть в словаре, но морфемный разбор отсутствует в учебной базе, попытка сохраняется с нулём очков. Если словарь не подтверждает сборку, применяется штраф. Словарь ограничен: такой результат сам по себе не доказывает, что слово никогда не употребляется.</p><p><b>Методика.</b> Учитываются школьные разборы из бумажного набора и добавленные разборы с одним суффиксом. Формы с чередованием, которые нельзя точно собрать из карточек, в задания не попадают. ∅ нужно поставить явно; приставку и суффикс можно пропустить.</p><p><b>Очки.</b> Фабрика: +10 за корень и +5 за каждую другую деталь; за новую форму найденного слова +4. Повтор слова: 0. Неподтверждённая сборка: −10. Неверный разбор слова, для которого есть проверенная схема: −5. Ремонт: +25 / −5. Обозначения: +10 / −5. Подсказка: −5. Итоговый счёт может быть отрицательным.</p><p><b>Данные.</b> Рекорды и настройка таймера сохраняются только в этом браузере. Имена и контакты игра не запрашивает. При уходе со вкладки и открытии шпаргалки таймер ставится на паузу.</p><p><small>Данные OpenCorpora: <a href="https://opencorpora.org/?page=downloads" target="_blank" rel="noopener">источник</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Файл dictionary.js содержит производную выборку словоформ; build_dictionary.py – способ её получения.</small></p>`)}
async function copy(){const text=`Мой результат в «Словолаборатории» – ${session.score} очков! ${modeTitles[mode]}: ${session.correct} ${mode==='build'?'собранных словоформ':'верных ответов'}.\n${location.href.split('#')[0]}`;try{await navigator.clipboard.writeText(text);toast('Результат скопирован. Можно отправлять.')}catch{openDialog('<h2>Твой результат</h2><p>Выдели и скопируй текст:</p><p style="user-select:all;white-space:pre-wrap">'+esc(text)+'</p>')}}
function leave(){openDialog('<h2>Завершить эксперимент?</h2><p>Текущие находки и очки попадут в статистику раунда.</p><div class="actions"><button class="btn lime" data-end-confirm>К итогам</button><button class="btn secondary" data-close>Продолжить</button></div>')}
let drag=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-part],[data-symbol]');if(!el||el.disabled||screen!=='game'||e.button!==0)return;drag={id:e.pointerId,el,x:e.clientX,y:e.clientY,moved:false,t:Number(el.dataset.type),p:el.dataset.part,symbol:el.hasAttribute('data-symbol')};el.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;if(!drag.moved)return;e.preventDefault();const ghost=document.querySelector('#drag-ghost');ghost.style.display='block';ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';ghost.innerHTML=drag.symbol?sym(drag.t):esc(drag.p);document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));const over=document.elementFromPoint(e.clientX,e.clientY)?.closest(drag.symbol?'[data-noteslot]':'[data-slot]');if(over)over.classList.add('drag-over')},{passive:false});
function endDrag(e,cancel=false){if(!drag)return;const d=drag;drag=null;document.querySelector('#drag-ghost').style.display='none';document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(d.moved){ignoreClickUntil=Date.now()+350;if(cancel)return;const over=document.elementFromPoint(e.clientX,e.clientY)?.closest(d.symbol?'[data-noteslot]':'[data-slot]');if(over&&!session.checked){if(d.symbol){session.answers[Number(over.dataset.noteslot)]=d.t;session.message='';renderGame()}else if(Number(over.dataset.slot)===d.t){put(d.t,d.p)}else toast('У этой детали другое место: '+names[d.t].toLowerCase()+'.');}}}
document.addEventListener('pointerup',e=>endDrag(e));document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('click',e=>{if(Date.now()<ignoreClickUntil){e.preventDefault();return;}const el=e.target.closest('button,a');if(!el||el.disabled)return;
if(el.closest('.brand')){e.preventDefault();screen==='game'?leave():home();return;}
if(el.id==='help'||el.hasAttribute('data-help')){help();return;}if(el.id==='about'){about();return;}if(el.id==='sound'){sound=!sound;el.setAttribute('aria-pressed',sound);el.setAttribute('aria-label',sound?'Выключить звук':'Включить звук');el.innerHTML=sound?'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 5 6 9H3v6h3l5 4zM15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></svg>':'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 5 6 9H3v6h3l5 4zM16 8l5 8m0-8-5 8"/></svg>';if(sound)beep();return;}
if(el.classList.contains('dialog-close')||el.hasAttribute('data-close')){closeDialog();return;}if(el.hasAttribute('data-end-confirm')){closeDialog();finish();return;}if(el.hasAttribute('data-home')){home();return;}if(el.dataset.intro){intro(el.dataset.intro);return;}if(el.hasAttribute('data-duration')){duration=Number(el.dataset.duration);settings.duration=duration;store.set('slovolab-settings',settings);intro(mode);return;}if(el.hasAttribute('data-start')){start();return;}if(el.hasAttribute('data-leave')||el.hasAttribute('data-finish')){leave();return;}if(el.hasAttribute('data-copy')){copy();return;}
if(!session||screen!=='game')return;
if(el.hasAttribute('data-symbol')){selectedSymbol=Number(el.dataset.symbol);renderGame();return;}if(el.hasAttribute('data-noteslot')){if(selectedSymbol===null){toast('Сначала выбери обозначение внизу.');return;}session.answers[Number(el.dataset.noteslot)]=selectedSymbol;session.message='';renderGame();return;}
if(el.hasAttribute('data-part')){put(Number(el.dataset.type),el.dataset.part);return;}if(el.hasAttribute('data-slot')){put(Number(el.dataset.slot),'');return;}if(el.hasAttribute('data-shelf')){session.shelf=Number(el.dataset.shelf);session.parts=['','','',''];session.message='Открыт ящик «'+shelfDefs[session.shelf].name+'». Находки и очки сохранены.';session.messageType='';renderGame();return;}if(el.hasAttribute('data-more-ends')){session.showAllEnds=!session.showAllEnds;renderGame();return;}if(el.hasAttribute('data-check')){check();return;}if(el.hasAttribute('data-next')){next();return;}if(el.hasAttribute('data-clear')){session.parts=['','','',''];session.message='';renderGame();return;}if(el.hasAttribute('data-hint'))hint();
});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});dialog.addEventListener('cancel',()=>{if(session)session.lastTick=performance.now()});document.addEventListener('visibilitychange',()=>{if(session)session.lastTick=performance.now()});home();
})();
</script></body></html>
